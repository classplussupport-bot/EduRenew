<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{margin:0;background:#08090d}
    #_er_loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#08090d;color:#7a7e9a;font-family:sans-serif;font-size:14px;gap:16px}
    #_er_loader svg{animation:_sp 1s linear infinite}
    @keyframes _sp{to{transform:rotate(360deg)}}
    #_er_err{display:none;color:#ef4444;font-size:13px;max-width:400px;text-align:center;line-height:1.6}
  </style>
</head>
<body>
<div id="_er_loader">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5b6cf5" stroke-width="2">
    <circle cx="12" cy="12" r="10" stroke-opacity=".2"/>
    <path d="M12 2a10 10 0 0 1 10 10"/>
  </svg>
  <span>Loading portal...</span>
  <div id="_er_err"></div>
</div>
<script>
  var _PAGE = "<?= page ?>";
  var _URL  = _PAGE === "student"
    ? "https://classplussupport-bot.github.io/EduRenew/Student_Demo.html"
    : "https://classplussupport-bot.github.io/EduRenew/Index.html";
  fetch(_URL)
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(h){ document.open(); document.write(h); document.close(); })
    .catch(function(err){
      document.querySelector("#_er_loader svg").style.display="none";
      var el=document.getElementById("_er_err");
      el.style.display="block";
      el.textContent="Failed to load portal: "+err.message+". Please try refreshing.";
    });
</script>
</body>
</html>
